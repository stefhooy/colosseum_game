[DEPENDENCIES]
#assets/unused/ holds source/reference files not loaded by the game at
#runtime (see assets/README.md's "Not wired up" section) — some of them
#(the source mp3, in particular) would actively break the pygbag build if
#left in assets/, since pygbag scans and validates every file it finds
#there regardless of whether the game code ever loads it. Note: pygbag's
#own ignorefiles/ignoredirs parser hard-rejects any entry containing a
#space, so files with spaces in their names can't be listed here directly
#at all — they have to live in an excluded directory instead, which is
#exactly why assets/unused/ exists.
ignoredirs = ["/.venv", "/build", "/dist", "/__pycache__", "/.git", "/.ipynb_checkpoints", "/game/.ipynb_checkpoints", "/assets/unused"]
ignorefiles = ["main.spec", "colosseum-curfew-web.zip", "colosseum-curfew-windows.zip", "uv.lock", "README.md", "PLAN.md", "pyproject.toml", "pygbag.ini"]
